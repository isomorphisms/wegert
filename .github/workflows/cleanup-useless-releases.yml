name: Clean useless phone releases

on:
  push:
    branches:
      - initial-phone-build
    paths:
      - .github/workflows/cleanup-useless-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: initial-phone-build

      - name: Delete phone-test releases without APK assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          deleted=()
          jq -c '.[] | select(.tag_name | startswith("phone-test-"))' releases.json | while read -r release; do
            tag=$(jq -r '.tag_name' <<<"$release")
            id=$(jq -r '.id' <<<"$release")
            apk_count=$(jq '[.assets[]? | select(.name | endswith(".apk"))] | length' <<<"$release")
            if [ "$apk_count" -eq 0 ]; then
              echo "Deleting useless release $tag"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || true
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
            else
              echo "Keeping $tag ($apk_count APK asset(s))"
            fi
          done

      - name: Record final release state
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > final-releases.json
          {
            echo '# Phone release cleanup'
            echo
            echo 'Removed every `phone-test-*` release that had no `.apk` asset.'
            echo
            echo 'Remaining phone-test releases:'
            jq -r '.[] | select(.tag_name | startswith("phone-test-")) | "- \(.tag_name): " + (([.assets[]?.name] | if length == 0 then ["no assets"] else . end) | join(", "))' final-releases.json
          } > CLEANUP_STATUS.md
          git fetch origin initial-phone-build
          git checkout -B initial-phone-build origin/initial-phone-build
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add CLEANUP_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record phone release cleanup'
            git push origin HEAD:initial-phone-build
          fi
