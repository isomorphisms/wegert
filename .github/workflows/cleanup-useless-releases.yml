name: Clean useless phone releases

on:
  push:
    branches:
      - initial-phone-build
    paths:
      - .github/workflows/cleanup-useless-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete phone-test releases without APK assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          jq -c '.[] | select(.tag_name | startswith("phone-test-"))' releases.json | while read -r release; do
            tag=$(jq -r '.tag_name' <<<"$release")
            id=$(jq -r '.id' <<<"$release")
            apk_count=$(jq '[.assets[]? | select(.name | endswith(".apk"))] | length' <<<"$release")
            if [ "$apk_count" -eq 0 ]; then
              echo "Deleting useless release $tag"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
            else
              echo "Keeping $tag ($apk_count APK asset(s))"
            fi
          done
