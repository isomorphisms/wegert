name: Clean useless phone releases

on:
  push:
    branches:
      - initial-phone-build
    paths:
      - .github/workflows/cleanup-useless-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: initial-phone-build

      - name: Delete obsolete phone-test releases 1 and 3
        shell: bash
        run: |
          set -euo pipefail
          for tag in phone-test-1 phone-test-3; do
            if release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null); then
              id=$(jq -r '.id' <<<"$release")
              echo "Deleting release $tag"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            else
              echo "Release $tag already absent"
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" 2>/dev/null || true
          done

      - name: Record final release state
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > final-releases.json
          {
            echo '# Phone release cleanup'
            echo
            echo 'Deleted obsolete releases `phone-test-1` and `phone-test-3` and their tags.'
            echo
            echo 'Remaining phone-test releases:'
            remaining=$(jq -r '.[] | select(.tag_name | startswith("phone-test-")) | "- \(.tag_name): " + (([.assets[]?.name] | if length == 0 then ["no assets"] else . end) | join(", "))' final-releases.json)
            if [ -n "$remaining" ]; then
              printf '%s\n' "$remaining"
            else
              echo '- none'
            fi
          } > CLEANUP_STATUS.md
          git fetch origin initial-phone-build
          git checkout -B initial-phone-build origin/initial-phone-build
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add CLEANUP_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record obsolete release deletion'
            git push origin HEAD:initial-phone-build
          fi
