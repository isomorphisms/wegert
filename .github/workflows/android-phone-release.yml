name: Android phone test release

on:
  push:
    branches:
      - initial-phone-build
    paths-ignore:
      - RELEASE_STATUS.md
      - .github/workflows/android-phone-release.yml
      - .github/workflows/cleanup-useless-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        id: apk
        continue-on-error: true
        run: gradle --no-daemon :app:assembleDebug

      - name: Name phone-test APK
        if: steps.apk.outcome == 'success'
        run: cp app/build/outputs/apk/debug/app-debug.apk wegert-phone-test.apk

      - uses: actions/upload-artifact@v4
        if: steps.apk.outcome == 'success'
        with:
          name: wegert-phone-test-apk
          path: wegert-phone-test.apk

      - name: Publish prerelease
        if: steps.apk.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Wegert phone test ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: wegert-phone-test.apk

      - name: Record build result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.apk.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          {
            echo '# Latest phone release'
            echo
            echo "build: ${BUILD_OUTCOME}"
            echo "commit: ${BUILD_SHA}"
            echo "run: ${RUN_NUMBER}"
            if [ "${BUILD_OUTCOME}" = success ]; then
              echo "release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/phone-test-${RUN_NUMBER}"
            fi
          } > RELEASE_STATUS.md
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add RELEASE_STATUS.md
          git commit -m "Record phone release ${RUN_NUMBER} (${BUILD_OUTCOME})"
          git push origin HEAD:initial-phone-build

      - name: Fail workflow when APK build failed
        if: steps.apk.outcome != 'success'
        run: exit 1
