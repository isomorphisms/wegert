name: Android phone test release

on:
  push:
    branches:
      - initial-phone-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name phone-test APK
        run: cp app/build/outputs/apk/debug/app-debug.apk wegert-phone-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-phone-test-apk
          path: wegert-phone-test.apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Wegert phone test ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: wegert-phone-test.apk
